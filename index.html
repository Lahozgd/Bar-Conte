<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<!-- @template name="Bar Conte — Bartenders Bible" description="Guía de barra en cuatro pestañas: botellas, entrenamiento, recetas y checklist." -->
<helmet>
<script src="bc-data.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>html,body{margin:0;padding:0;background:#000}*{box-sizing:border-box}::selection{background:#E5B84B;color:#000}input,button,select{font:inherit}a{color:#E5B84B}a:hover{color:#F2D183}</style>
</helmet>
<div style="min-height:100vh;background:#000;color:#F7F4EA;font-family:Archivo,system-ui,sans-serif;-webkit-font-smoothing:antialiased">
<header style="max-width:1180px;margin:0 auto;padding:34px 24px 0">
<p style="font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:600;letter-spacing:0.32em;text-transform:uppercase;color:#57A374;margin:0 0 22px">Firenze · since 1919</p>
<h1 style="font-weight:900;font-size:clamp(46px,11vw,124px);line-height:0.82;letter-spacing:-0.045em;text-transform:uppercase;margin:0;color:#F7F4EA">Bar<br>Conte</h1>
<div style="display:flex;align-items:baseline;justify-content:space-between;gap:20px;flex-wrap:wrap;border-top:3px solid #E5B84B;margin-top:26px;padding-top:15px">
<p style="font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;letter-spacing:0.28em;text-transform:uppercase;color:#57A374;margin:0">Bartenders Bible</p>
<p style="font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:0.12em;text-transform:uppercase;color:#6E6A5A;margin:0">163 bottles · 162 origins verified</p>
</div>
</header>
<nav style="position:sticky;top:0;z-index:30;background:rgba(0,0,0,0.94);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);margin:26px 0 40px">
<div style="max-width:1180px;margin:0 auto;padding:14px 24px;display:flex;flex-wrap:wrap;gap:8px">
<sc-for list="{{ tabs }}" as="t" hint-placeholder-count="4">
<sc-if value="{{ t.on }}"><button onClick="{{ t.pick }}" style="flex:0 0 auto;cursor:pointer;border:2px solid #E5B84B;background:#E5B84B;color:#000;padding:11px 20px;font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;letter-spacing:0.16em;text-transform:uppercase">{{ t.label }}</button></sc-if>
<sc-if value="{{ t.off }}"><button onClick="{{ t.pick }}" style="flex:0 0 auto;cursor:pointer;border:2px solid #22251C;background:#000;color:#8A8674;padding:11px 20px;font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;letter-spacing:0.16em;text-transform:uppercase" style-hover="border-color:#57A374;color:#F7F4EA">{{ t.label }}</button></sc-if>
</sc-for>
</div>
</nav>
<main style="max-width:1180px;margin:0 auto;padding:0 24px 90px">
<div hidden="{{ hideCards }}"><dc-import name="BcBottles" hint-size="100%,700px"></dc-import></div>
<div hidden="{{ hideRecipes }}"><dc-import name="BcRecipes" hint-size="100%,600px"></dc-import></div>
<div hidden="{{ hideChecklist }}"><dc-import name="BcChecklist" hint-size="100%,600px"></dc-import></div>
<div hidden="{{ hideTraining }}"><dc-import name="BcTraining" hint-size="100%,520px"></dc-import></div>
<footer style="margin-top:60px;padding-top:20px;border-top:2px solid #22251C;font-family:'IBM Plex Mono',monospace;font-size:10.5px;line-height:1.9;color:#55524A;text-transform:uppercase;letter-spacing:0.06em">Origins were verified one by one — anything flagged in red could not be confirmed with confidence.<br>"Serve it" lists real classic cocktails where one exists, otherwise the most common honest way it is poured.</footer>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { view: 'cards' };
  renderVals() {
    const v = this.state.view;
    const tabs = [['cards', 'Bottles'], ['recipes', 'Recipes'], ['checklist', 'Checklist'], ['training', 'Training']].map(([k, label]) => ({
      label, on: v === k, off: v !== k, pick: () => this.setState({ view: k })
    }));
    return {
      tabs,
      hideCards: v !== 'cards', hideTraining: v !== 'training', hideRecipes: v !== 'recipes', hideChecklist: v !== 'checklist'
    };
  }
}
</script>
</body>
</html>
